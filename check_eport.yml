name: Auto Check ePort Status

on:
  repository_dispatch:
    types: [check_eport_job]

jobs:
  run-eport-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests playwright
          playwright install --with-deps chromium

      - name: Run Main Script
        env:
          ROW_INDEX: ${{ github.event.client_payload.row_index }}
          JOB_NO: ${{ github.event.client_payload.job_no }}
          CONTS_STR: ${{ github.event.client_payload.conts_str }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          PASSCODE: ${{ github.event.client_payload.passcode }}
        run: |
          python main.py
